# Publishes to PyPI when a tag such as v0.1.0 is pushed. Configure a
# "trusted publisher" for this repository and workflow on pypi.org first
# (see docs/publishing.ru.md); no token is stored in the repository.
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - run: uv publish
